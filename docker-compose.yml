services:
  postgres:
    image: postgres:16
    container_name: stock-reservation-postgres
    environment:
      POSTGRES_DB: stockreservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - stockreservation_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockreservation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockreservation_pgdata:
